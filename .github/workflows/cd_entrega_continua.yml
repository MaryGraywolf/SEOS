name: CD - Entrega Contínua

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verificar_ci:
    name: Exigir CI aprovado para o commit da tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verificar execução bem-sucedida do CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          aprovadas=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci_integracao_e_qualidade.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --json databaseId \
            --jq 'length')
          if [ "$aprovadas" -eq 0 ]; then
            echo "Nenhuma execução aprovada do CI para o commit $GITHUB_SHA. Publicação bloqueada."
            exit 1
          fi
          echo "CI aprovado para o commit $GITHUB_SHA."

  publish_package:
    name: Publicar Release no GitHub Packages
    needs: [verificar_ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar JDK 11 e Autenticação do Maven
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: "11"
          distribution: "temurin"
          server-id: github
          server-password: GITHUB_TOKEN

      - name: Publicar Pacote (Deploy)
        run: mvn versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false && mvn deploy -s .github/settings-security.xml
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{github.actor}}

      - name: Atestar proveniência do pacote
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: target/*.jar

  notify_failure_cd:
    needs: [verificar_ci, publish_package]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      # Os dados do contexto do GitHub entram apenas por variáveis de ambiente
      # e o JSON é montado pelo jq, evitando injeção de comandos no shell
      # (regra Semgrep run-shell-injection).
      - name: Enviar alerta para o Microsoft Teams
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK }}
          REPOSITORIO: ${{ github.repository }}
          VERSAO_TAG: ${{ github.ref_name }}
          URL_EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg repositorio "$REPOSITORIO" \
            --arg versao "$VERSAO_TAG" \
            --arg url "$URL_EXECUCAO" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        text: "📦 Falha na Publicação do Pacote (CD)!",
                        weight: "Bolder",
                        size: "Large",
                        color: "Attention"
                      },
                      {
                        type: "TextBlock",
                        text: "Ocorreu um erro ao tentar publicar a nova versão do SEOS no GitHub Packages.",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Repositório:", value: $repositorio },
                          { title: "Versão (Tag):", value: $versao }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "Acessar Logs do Deploy",
                        url: $url
                      }
                    ]
                  }
                }
              ]
            }')
          curl -H "Content-Type: application/json" --data "$payload" "$WEBHOOK_URL"
