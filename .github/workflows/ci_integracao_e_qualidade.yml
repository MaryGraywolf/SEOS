name: CI - Integração e Qualidade

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_and_test:
    name: Build, Testes e Qualidade (Sonar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar JDK 11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Build, Testes e SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=MaryGraywolf_SEOS -Dsonar.organization=marygraywolf2403 -Dsonar.host.url=https://sonarcloud.io

  security_sast:
    name: Segurança e Cadeia de Suprimentos (Semgrep)
    needs: [build_and_test]
    runs-on: ubuntu-latest
    # Imagem oficial do Semgrep 1.90.0 fixada por digest (sem instalação via pip)
    container:
      image: semgrep/semgrep:1.90.0@sha256:7b625711ba9b6d1a543e308967b18c01b59932490a5536a06422666474bf6ee4
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar Semgrep
        run: |
          semgrep scan --config="p/java" --config="p/owasp-top-ten" --sarif --output=semgrep.sarif

      - name: Upload do relatório para o GitHub Security
        uses: github/codeql-action/upload-sarif@f6e388ebf0efc915c6c5b165b019ee61a6746a38
        if: always()
        with:
          sarif_file: semgrep.sarif

  notify_failure_ci:
    name: ChatOps - Alerta no Teams
    needs: [build_and_test, security_sast]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      # Os dados do contexto do GitHub entram apenas por variáveis de ambiente
      # e o JSON é montado pelo jq, evitando injeção de comandos no shell
      # (regra Semgrep run-shell-injection).
      - name: Enviar alerta para o Microsoft Teams
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK }}
          REPOSITORIO: ${{ github.repository }}
          REFERENCIA: ${{ github.ref_name }}
          URL_EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg repositorio "$REPOSITORIO" \
            --arg referencia "$REFERENCIA" \
            --arg url "$URL_EXECUCAO" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        text: "🚨 Falha na Integração Contínua (CI)!",
                        weight: "Bolder",
                        size: "Large",
                        color: "Attention"
                      },
                      {
                        type: "TextBlock",
                        text: "Ocorreu um erro durante a validação do código na esteira principal (Build, Testes, SonarCloud ou Semgrep). O merge deve ser bloqueado.",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Repositório:", value: $repositorio },
                          { title: "Branch / Ref:", value: $referencia }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "Acessar Logs da Pipeline",
                        url: $url
                      }
                    ]
                  }
                }
              ]
            }')
          curl -H "Content-Type: application/json" --data "$payload" "$WEBHOOK_URL"
