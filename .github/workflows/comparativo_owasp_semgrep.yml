name: Comparativo OWASP - Antes e Depois da Esteira (Semgrep)

# Executa o Semgrep com as mesmas regras sobre dois pontos do histórico:
#   ANTES : commit 6982a7d (núcleo + testes, sem esteira DevSecOps)
#   DEPOIS: tag v1.1.0 (com CI, SAST, CD e ChatOps)
# Os resultados alimentam o Apêndice B do TCC.

permissions:
  contents: read

on:
  push:
    branches: ["feature/docs"]
    paths:
      - ".github/workflows/comparativo_owasp_semgrep.yml"
  workflow_dispatch:

jobs:
  scan:
    name: Semgrep - ${{ matrix.cenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cenario: ANTES
            ref: 6982a7da87509b96ef82e66c7958a39f159cf99b
          - cenario: DEPOIS
            ref: v1.1.0
    steps:
      - name: Checkout do código (${{ matrix.cenario }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.ref }}

      - name: Instalar Semgrep
        run: |
          python -m pip install --only-binary :all: semgrep==1.90.0

      - name: Executar varredura (OWASP Top 10 + Java)
        run: |
          semgrep scan \
            --config="p/owasp-top-ten" \
            --config="p/java" \
            --metrics=off \
            --json --output=semgrep-${{ matrix.cenario }}.json \
            src/main

      - name: Resumo por categoria OWASP
        run: |
          {
            echo "## Semgrep - ${{ matrix.cenario }} (\`${{ matrix.ref }}\`)"
            echo
            echo "Arquivos varridos: $(jq '.paths.scanned | length' semgrep-${{ matrix.cenario }}.json)"
            echo "Total de achados: $(jq '.results | length' semgrep-${{ matrix.cenario }}.json)"
            echo
            echo "| Categoria OWASP | Achados |"
            echo "| :--- | ---: |"
            jq -r '
              [.results[] | (.extra.metadata.owasp // ["Sem categoria"])[]]
              | group_by(.) | map("| \(.[0]) | \(length) |") | .[]
            ' semgrep-${{ matrix.cenario }}.json
            echo
            echo "| Regra | Arquivo:linha |"
            echo "| :--- | :--- |"
            jq -r '.results[] | "| \(.check_id) | \(.path):\(.start.line) |"' semgrep-${{ matrix.cenario }}.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar laudo completo
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: semgrep-${{ matrix.cenario }}
          path: semgrep-${{ matrix.cenario }}.json
